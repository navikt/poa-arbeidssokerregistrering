name: Build and deploy

on:
  push:
    branches:
      - main
      - dev/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install
        run: pnpm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Test
        run: pnpm run test:ci

      - name: Knip
        run: pnpm exec knip --no-exit-code --reporter=markdown >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NEXT_PUBLIC_DITTNAV_URL: https://www.nav.no/minside
      NEXT_PUBLIC_ARBEIDSSOEKERREGISTERET_URL: https://www.nav.no/arbeidssoekerregisteret
      NEXT_PUBLIC_DAGPENGESOKNAD_URL: https://www.nav.no/dagpenger/soknad
      NEXT_PUBLIC_BRUKERDIALOG_DAGPENGER_URL: https://www.nav.no/dagpenger/soknad
      UU_DEKORATOR_SMOKE: '0'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install
        run: pnpm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: List and distribute E2E tests
        run: |
          node --test scripts/test-fordel-e2e-tester.mjs
          pnpm exec playwright test --list --reporter=json > "$RUNNER_TEMP/e2e-list.json"
          node scripts/fordel-e2e-tester.mjs "$RUNNER_TEMP/e2e-list.json" "$RUNNER_TEMP/e2e-shards" 4

      - name: Run E2E tests
        run: pnpm exec playwright test --test-list="$RUNNER_TEMP/e2e-shards/shard-${{ matrix.shard }}.txt" --workers=2 --reporter=line,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: e2e-${{ matrix.shard }}.zip

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-blob-e2e-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test results
        if: always() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-e2e-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  uu-komponenter:
    name: UU component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_DITTNAV_URL: https://www.nav.no/minside
      NEXT_PUBLIC_ARBEIDSSOEKERREGISTERET_URL: https://www.nav.no/arbeidssoekerregisteret
      NEXT_PUBLIC_DAGPENGESOKNAD_URL: https://www.nav.no/dagpenger/soknad
      NEXT_PUBLIC_BRUKERDIALOG_DAGPENGER_URL: https://www.nav.no/dagpenger/soknad
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install
        run: pnpm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run component tests
        run: pnpm test:uu:komponenter --workers=1 --reporter=line,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: komponenter.zip

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-blob-komponenter
          path: blob-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test results
        if: always() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-komponenter
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  dekorator-smoke:
    name: Decorator smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_DITTNAV_URL: https://www.nav.no/minside
      NEXT_PUBLIC_ARBEIDSSOEKERREGISTERET_URL: https://www.nav.no/arbeidssoekerregisteret
      NEXT_PUBLIC_DAGPENGESOKNAD_URL: https://www.nav.no/dagpenger/soknad
      NEXT_PUBLIC_BRUKERDIALOG_DAGPENGER_URL: https://www.nav.no/dagpenger/soknad
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install
        run: pnpm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run decorator smoke tests
        run: pnpm test:dekorator --workers=1 --reporter=line,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: dekorator.zip

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-blob-dekorator
          path: blob-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test results
        if: always() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-dekorator
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  playwright-rapport:
    name: Merge Playwright reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [e2e, uu-komponenter, dekorator-smoke]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install
        run: pnpm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Download Playwright blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-html-rapport
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

  build:
    name: Build and Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, e2e, uu-komponenter, dekorator-smoke]
    permissions:
      contents: 'read'
      packages: 'write'
      id-token: 'write'
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install
        run: pnpm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_ASSET_PREFIX: https://cdn.nav.no/paw/arbeidssokerregistrering
          NEXT_PUBLIC_BASE_PATH: /arbeid/registrering

      - name: Upload static files to NAV CDN
        uses: nais/deploy/actions/cdn-upload/v2@7b60caaded00332e9aa117a8342daa0876851dfe # v2
        with:
          team: paw
          source: ./.next/static
          destination: arbeidssokerregistrering/_next
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}

      - name: Push docker image to GAR
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: paw
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}

